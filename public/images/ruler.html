<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; padding: 0; position: relative; background: #fff; }
    img { display: block; }
    .grid {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    }
    .line-y {
      position: absolute; left: 0; width: 100%; height: 1px; background: rgba(255,0,0,0.5);
    }
    .label { position: absolute; left: 0; background: rgba(255,0,0,0.8); color: #fff; font-size: 12px; }
  </style>
</head>
<body>
  <img src="shah_times_article.jpg" id="img" />
  <script>
    window.onload = () => {
      const img = document.getElementById('img');
      const h = img.height;
      for (let y = 0; y < h; y += 100) {
        const line = document.createElement('div');
        line.className = 'line-y';
        line.style.top = y + 'px';
        const label = document.createElement('div');
        label.className = 'label';
        label.style.top = y + 'px';
        label.innerText = y;
        document.body.appendChild(line);
        document.body.appendChild(label);
      }
    };
  </script>
</body>
</html>
